# 설계 메모: 전국지역화폐가맹점표준데이터 181,710건 — wooakidmeal에서 확립한 Option-B
# 패턴을 채택하되, 시도/시군구 2단계로는 매장명 롱테일 키워드를 전혀 못 잡는다는 지적을 받고
# 3단계(시도→시군구→동/읍/면, 약 960개 페이지)로 확장함. 주소에서 동 추출 성공률 74%,
# 실패분(26%)은 "기타" 버킷으로 시군구 페이지에 남김. 개별 가맹점 페이지는 여전히 없음
# (181,710 × 8KB ≈ 1.4GB로 GitHub Pages 1GB 리밋 위험 — wooakidmeal 재발 우려로 보류).
# 2026-09-02.
