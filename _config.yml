title: 우아페이 - 전국 지역화폐 가맹점 찾기
description: >-
  전국 181,710곳의 지역화폐(지역사랑상품권) 가맹점을 지역별로 검색하세요.
  시군구 목록 + 이름 검색으로 원하는 가맹점을 찾을 수 있습니다.
url: "https://wooapay.wooahouse.com"
baseurl: ""
lang: ko
